[package]
name = "cce-core"
version = "0.1.0"
edition = "2021"
description = "The GUI-free half of the cce toolkit: config, input bindings, the animations switch, units, IPC and the DE's spec parsers"

[lib]
name = "cce_core"
path = "src/lib.rs"

[features]
default = ["config"]
# `config` and `input`: the KDL config and input.kdl. Off, the crate is the
# spec parsers, units, the animations switch and IPC alone, on log, web-time
# and libc — what cce-window-manager takes for its camera ramp.
config = ["dep:kdl", "json"]
# `json`: `ipc::ctl::WindowInfo`, the `windows --json` line, for a process that
# reads the window list without the KDL config (the desktop portal, cce-remote).
json = ["dep:serde_json"]
# What `cfg(test)` means inside this crate, for a DEPENDENT's test build: the
# config home is a per-process directory nobody creates, natural scrolling
# reads false and the animations switch is on unless a test forces it, so a
# suite never reads the machine's ~/.config/cce or /run/cce. cce-ui turns it on
# through its dev-dependency only (resolver 2 keeps dev-dependency features out
# of normal builds), which is what keeps its suite isolated now that these
# modules live here; a shipped binary never has it.
test-isolation = []
# `l10n`: message catalogues in Project Fluent's format (fluent-bundle). Off by default:
# a process that shows no text (the compositor) does not carry it; cce-ui turns it on.
l10n = ["dep:fluent-bundle", "dep:unic-langid"]

[dependencies]
kdl = { version = "4.6", optional = true }
serde_json = { version = "1.0", optional = true }
log = "0.4"
# `Instant` that works in the browser: std's panics on wasm32-unknown-unknown.
web-time = "1"
fluent-bundle = { version = "0.16", optional = true }
unic-langid = { version = "0.9", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
